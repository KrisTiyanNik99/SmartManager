<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSupply - Product Form</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main>
        <!-- Sidebar (same as above, abbreviated for brevity) -->
        <div class="sidebar-container">
            <nav>
                <div class="side-navbar">
                    <div class="app-branding">
                        <div class="app-name">SmartSupply</div>
                        <div class="app-version">v1.0.0</div>
                    </div>
                    <div class="func-block">
                        <a href="home"><p>Dashboard</p></a>
                        <a href="cart.html"><p>Request Cart</p></a>
                    </div>
                    <div class="func-block">
                        <span>Inventory</span>
                        <a href="products.html" class="active"><p>Products</p></a>
                        <a href="suppliers.html"><p>Suppliers</p></a>
                        <a href="groups.html"><p>Groups</p></a>
                    </div>
                    <div class="func-block">
                        <span>Requests</span>
                        <a href="request-history.html"><p>Request History</p></a>
                        <a href="tasks.html"><p>Task Manager</p></a>
                    </div>
                    <div class="func-block">
                        <span>Utility</span>
                        <a href="settings.html"><p>Settings</p></a>
                    </div>
                    <div class="func-block">
                        <span>Admin</span>
                        <a href="admin.html"><p>User Management</p></a>
                    </div>
                    <div class="func-block">
                        <a class="logout" href="login.html"><p>Logout</p></a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <h1 class="page-title">Add/Edit Product</h1>

            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter product name">
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="">Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Drinks">Drinks</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="supplier">Supplier</label>
                        <select id="supplier" name="supplier" required>
                            <option value="">Select a supplier</option>
                            <option value="Tech Distributors">Tech Distributors</option>
                            <option value="Office Plus">Office Plus</option>
                            <option value="Cable Co">Cable Co</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price">Price ($)</label>
                        <input type="number" id="price" name="price" step="0.01" required placeholder="Enter price">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Enter product description"></textarea>
                    </div>

                    <!-- Dynamic fields based on category (shown as example) -->
                    <div id="dynamic-fields">
                        <!-- For Food -->
                        <div class="form-group">
                            <label for="calories">Calories</label>
                            <input type="number" id="calories" name="calories" placeholder="Enter calories">
                        </div>
                        <div class="form-group">
                            <label for="expiration">Expiration Date</label>
                            <input type="date" id="expiration" name="expiration">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button-primary">Save Product</button>
                        <a href="products.html" class="button-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">© 2025 SmartSupply. All rights reserved.</footer>
</body>
</html>
