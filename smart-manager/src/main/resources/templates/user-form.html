<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSupply - User Form</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main>
        <!-- Sidebar (abbreviated) -->
        <div class="sidebar-container">
            <nav>
                <div class="side-navbar">
                    <div class="app-branding">
                        <div class="app-name">SmartSupply</div>
                        <div class="app-version">v1.0.0</div>
                    </div>
                    <div class="func-block">
                        <a href="home"><p>Dashboard</p></a>
                        <a href="cart.html"><p>Request Cart</p></a>
                    </div>
                    <div class="func-block">
                        <span>Inventory</span>
                        <a href="products.html"><p>Products</p></a>
                        <a href="suppliers.html"><p>Suppliers</p></a>
                        <a href="groups.html"><p>Groups</p></a>
                    </div>
                    <div class="func-block">
                        <span>Requests</span>
                        <a href="request-history.html"><p>Request History</p></a>
                        <a href="tasks.html"><p>Task Manager</p></a>
                    </div>
                    <div class="func-block">
                        <span>Utility</span>
                        <a href="settings.html"><p>Settings</p></a>
                    </div>
                    <div class="func-block">
                        <span>Admin</span>
                        <a href="admin.html" class="active"><p>User Management</p></a>
                    </div>
                    <div class="func-block">
                        <a class="logout" href="login.html"><p>Logout</p></a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <h1 class="page-title">Add/Edit User</h1>

            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter user's full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Enter email address">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter password">
                        <small>Leave blank to keep current password</small>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" name="isAdmin" value="true">
                            Grant Admin Privileges
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button-primary">Save User</button>
                        <a href="admin.html" class="button-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">© 2025 SmartSupply. All rights reserved.</footer>
</body>
</html>
