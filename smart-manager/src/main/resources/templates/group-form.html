<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSupply - Group Form</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main>
        <!-- Sidebar (abbreviated) -->
        <div class="sidebar-container">
            <nav>
                <div class="side-navbar">
                    <div class="app-branding">
                        <div class="app-name">SmartSupply</div>
                        <div class="app-version">v1.0.0</div>
                    </div>
                    <div class="func-block">
                        <a href="home"><p>Dashboard</p></a>
                        <a href="cart.html"><p>Request Cart</p></a>
                    </div>
                    <div class="func-block">
                        <span>Inventory</span>
                        <a href="products.html"><p>Products</p></a>
                        <a href="suppliers.html"><p>Suppliers</p></a>
                        <a href="groups.html" class="active"><p>Groups</p></a>
                    </div>
                    <div class="func-block">
                        <span>Requests</span>
                        <a href="request-history.html"><p>Request History</p></a>
                        <a href="tasks.html"><p>Task Manager</p></a>
                    </div>
                    <div class="func-block">
                        <span>Utility</span>
                        <a href="settings.html"><p>Settings</p></a>
                    </div>
                    <div class="func-block">
                        <span>Admin</span>
                        <a href="admin.html"><p>User Management</p></a>
                    </div>
                    <div class="func-block">
                        <a class="logout" href="login.html"><p>Logout</p></a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <h1 class="page-title">Create/Edit Group</h1>

            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label for="groupName">Group Name</label>
                        <input type="text" id="groupName" name="groupName" required placeholder="Enter group name">
                    </div>

                    <div class="form-group">
                        <label>Select Communication Channels</label>
                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" name="channels" value="discord">
                                💬 Discord
                            </label>
                            <label>
                                <input type="checkbox" name="channels" value="viber">
                                📱 Viber
                            </label>
                            <label>
                                <input type="checkbox" name="channels" value="gmail">
                                📧 Gmail
                            </label>
                            <label>
                                <input type="checkbox" name="channels" value="messenger">
                                💌 Messenger
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3" placeholder="Enter group description"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button-primary">Save Group</button>
                        <a href="groups.html" class="button-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">© 2025 SmartSupply. All rights reserved.</footer>
</body>
</html>
